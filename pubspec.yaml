name: breastscan
description: "A new Flutter project."
publish_to: 'none' # Uygulama pub.dev'e yüklenmesin

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4

  # UI ve yardımcı paketler
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  provider: ^6.1.1

  http: 1.0.0

  path: ^1.8.3
  file_picker: ^8.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png